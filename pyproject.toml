[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "access_to_excel"
version = "0.0.1"
description = "Convert Microsoft Access databases (.mdb/.accdb) to Excel (.xlsx) or CSV"
authors = [{ name = "AccessToExcel" }]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyodbc>=4.0",
  "openpyxl>=3.1",
  "xlsxwriter>=3.1; platform_system == 'Windows'"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
access-to-excel = "access_to_excel.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
